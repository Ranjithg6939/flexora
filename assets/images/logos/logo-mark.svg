<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" class="flexora-svg-logo">
  <defs>
    <!-- Cosmic Midnight Base Gradient -->
    <linearGradient id="fx-cosmic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0C42"/>
      <stop offset="50%" stop-color="#12062E"/>
      <stop offset="100%" stop-color="#080218"/>
    </linearGradient>

    <!-- Neon Arch Gradient (Cyan -> Magenta -> Violet) -->
    <linearGradient id="fx-arch-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#EC4899"/>
      <stop offset="85%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="fx-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="35%" stop-color="#EC4899"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Core Ribbon Primary (Neon Magenta to Violet) -->
    <linearGradient id="fx-core-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="45%" stop-color="#EC4899"/>
      <stop offset="85%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Core Ribbon Secondary (Cyan to Electric Violet) -->
    <linearGradient id="fx-core-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Sheen Gradient -->
    <linearGradient id="fx-sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="fx-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fx-laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner Badge Clip -->
    <clipPath id="fx-badge-clip">
      <rect x="14" y="16" width="72" height="72" rx="20"/>
    </clipPath>

    <style>
      .fx-arch-glow {
        animation: fxArchPulse 3.5s ease-in-out infinite;
      }
      @keyframes fxArchPulse {
        0%, 100% { opacity: 0.9; stroke-width: 3.5; }
        50% { opacity: 1; stroke-width: 4.5; filter: drop-shadow(0 0 6px #EC4899); }
      }
      .fx-laser-carriage {
        animation: fxLaserScan 3.5s ease-in-out infinite alternate;
      }
      @keyframes fxLaserScan {
        0% { transform: translateY(-10px); opacity: 0.35; }
        30%, 70% { opacity: 0.95; }
        100% { transform: translateY(16px); opacity: 0.35; }
      }
      .fx-sheen-swipe {
        animation: fxSheenPass 4.5s ease-in-out infinite;
      }
      @keyframes fxSheenPass {
        0%, 45% { transform: translateX(-90px) skewX(-26deg); opacity: 0; }
        50%, 75% { opacity: 0.75; }
        80%, 100% { transform: translateX(110px) skewX(-26deg); opacity: 0; }
      }
      .fx-neon-dot {
        transform-origin: center;
        transform-box: fill-box;
        animation: fxNeonDotPulse 3s ease-in-out infinite;
      }
      .fx-dot-c { animation-delay: 0s; }
      .fx-dot-m { animation-delay: 0.4s; }
      .fx-dot-v { animation-delay: 0.8s; }
      .fx-dot-w { animation-delay: 1.2s; }
      @keyframes fxNeonDotPulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        35% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 3px currentColor); }
        70% { transform: scale(1); opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Ambient Outer Glow Halo -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.25"/>

  <!-- Top Signature Arch Swoosh (Model matching uploaded design) -->
  <!-- Outer Arch Glow Shadow -->
  <path d="M 8 52 C 8 24, 28 5, 54 5 C 72 5, 87 15, 93 30" 
        fill="none" 
        stroke="#EC4899" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.35" 
        filter="url(#fx-neon-glow)"/>

  <!-- Sharp Gradient Neon Arch -->
  <path class="fx-arch-glow" 
        d="M 9 52 C 9 25, 29 6, 54 6 C 72 6, 86 16, 92 30" 
        fill="none" 
        stroke="url(#fx-arch-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round"/>

  <!-- Arch Lead-in Spark Node -->
  <circle cx="9" cy="52" r="2.8" fill="#00F5FF" filter="url(#fx-neon-glow)"/>
  <circle cx="92" cy="30" r="2.8" fill="#8B5CF6" filter="url(#fx-neon-glow)"/>

  <!-- Inner Badge Container -->
  <g clip-path="url(#fx-badge-clip)">
    <!-- Base Midnight Fill -->
    <rect x="14" y="16" width="72" height="72" rx="20" fill="url(#fx-cosmic-bg)"/>

    <!-- Subtle Isometric Grid -->
    <g stroke="rgba(139, 92, 246, 0.12)" stroke-width="0.8" stroke-dasharray="2 3">
      <line x1="20" y1="36" x2="80" y2="36"/>
      <line x1="20" y1="52" x2="80" y2="52"/>
      <line x1="20" y1="68" x2="80" y2="68"/>
      <line x1="36" y1="20" x2="36" y2="80"/>
      <line x1="52" y1="20" x2="52" y2="80"/>
      <line x1="68" y1="20" x2="68" y2="80"/>
    </g>

    <!-- Top Roll Head Cylinder -->
    <rect x="26" y="23" width="48" height="6.5" rx="3.25" fill="#241048" stroke="rgba(236,72,153,0.4)" stroke-width="0.8"/>
    <circle cx="28" cy="26.25" r="2.2" fill="#00F5FF"/>
    <circle cx="72" cy="26.25" r="2.2" fill="#8B5CF6"/>

    <!-- 3D Monogram "F" Letterform (Modern Studio Press Fold) -->
    <!-- Drop Shadow Layer -->
    <path d="M 29 27 L 68 27 L 64 39 L 43 39 L 43 47 L 59 47 L 56 56 L 43 56 L 43 71 L 30 67 Z" 
          fill="rgba(0,0,0,0.55)" 
          transform="translate(2, 2)"/>

    <!-- Primary Neon Magenta to Violet Ribbon -->
    <path class="fx-core-stem" d="
      M 30 26.5 
      C 30 25.5, 31 24.5, 32.5 24.5 
      L 69 24.5 
      C 71 24.5, 72.5 26, 72 28 
      L 67 40 
      C 66.3 41.5, 64.8 42.5, 63 42.5 
      L 44 42.5 
      L 44 48 
      L 60 48 
      C 62 48, 63.3 49.3, 62.8 51.3 
      L 59.5 58 
      C 59 59.5, 57.5 60.5, 56 60.5 
      L 44 60.5 
      L 44 73 
      C 44 74.5, 42.8 75.8, 41.2 75.3 
      L 32 72 
      C 30.8 71.5, 30 70.3, 30 69 
      Z
    " fill="url(#fx-core-1)"/>

    <!-- Secondary Cyan/Violet Dimensional Wing & Crossbar -->
    <path class="fx-core-cross" d="
      M 30 24.5 
      L 69 24.5 
      L 65 32 
      L 41 32 
      L 41 48 
      L 60 48 
      L 57 55 
      L 41 55 
      L 41 70 
      L 30 66 
      Z
    " fill="url(#fx-core-2)" opacity="0.92"/>

    <!-- Fold Corner Tip -->
    <path d="M 32 72 L 44 73 L 49 68 L 37 67 Z" fill="#00F5FF" opacity="0.85"/>

    <!-- Precision UV Laser Beam Carriage -->
    <g class="fx-laser-carriage">
      <line class="fx-laser-beam" x1="20" y1="50" x2="80" y2="50" stroke="#00F5FF" stroke-width="1.8" filter="url(#fx-laser-glow)" opacity="0.9"/>
      <circle class="fx-laser-nozzle" cx="50" cy="50" r="2.8" fill="#FFFFFF" filter="url(#fx-laser-glow)"/>
    </g>

    <!-- Calibration Dots (Cyan, Magenta, Violet, White) -->
    <g class="fx-neon-dots">
      <circle class="fx-neon-dot fx-dot-c" cx="50" cy="71" r="2.6" fill="#00F5FF"/>
      <circle class="fx-neon-dot fx-dot-m" cx="58" cy="71" r="2.6" fill="#EC4899"/>
      <circle class="fx-neon-dot fx-dot-v" cx="66" cy="71" r="2.6" fill="#8B5CF6"/>
      <circle class="fx-neon-dot fx-dot-w" cx="74" cy="71" r="2.6" fill="#FFFFFF"/>
    </g>

    <!-- Glossy Sheen Wipe -->
    <rect class="fx-sheen-swipe" x="-70" y="0" width="40" height="110" fill="url(#fx-sheen-grad)" transform="skewX(-26)"/>
  </g>

  <!-- Glowing Outer Rounded Border -->
  <rect class="fx-badge-border" 
        x="14" y="16" width="72" height="72" rx="20" 
        fill="none" 
        stroke="url(#fx-border-grad)" 
        stroke-width="2.2" 
        filter="url(#fx-neon-glow)"/>
</svg>

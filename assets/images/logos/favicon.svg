<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-cosmic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0C42"/>
      <stop offset="50%" stop-color="#12062E"/>
      <stop offset="100%" stop-color="#080218"/>
    </linearGradient>
    <linearGradient id="fav-arch-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#EC4899"/>
      <stop offset="85%" stop-color="#8B5CF6"/>

    <path d="M 20 16 L 45 16 C 46.5 16, 47.5 17, 47 18.5 L 44 26 C 43.5 27, 42.5 27.5, 41 27.5 L 28 27.5 L 28 32 L 39 32 C 40.5 32, 41.5 33, 41 34.5 L 39 39 C 38.5 40, 37.5 40.5, 36 40.5 L 28 40.5 L 28 48 C 28 49.2, 27 50, 26 49.5 L 21 47.5 C 20.2 47, 20 46.2, 20 45.5 Z" fill="url(#fav-core-1)"/>
    <circle cx="33" cy="46" r="1.5" fill="#00F5FF"/>
    <circle cx="37" cy="46" r="1.5" fill="#EC4899"/>
    <circle cx="41" cy="46" r="1.5" fill="#8B5CF6"/>
